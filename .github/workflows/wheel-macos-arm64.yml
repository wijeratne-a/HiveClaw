# Build a macOS arm64 wheel (PyO3 extension + bundled pheromoned) via cibuildwheel → maturin.
# Artifact: hiveclaw-python-wheel-macos-arm64/*.whl
name: Wheel macOS arm64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/hiveclaw-python/**"
      - "crates/hiveclaw-daemon/**"
      - "crates/hiveclaw-core/**"
      - "crates/hiveclaw-backend-metal/**"
      - ".github/workflows/wheel-macos-arm64.yml"

permissions:
  contents: read

jobs:
  wheel:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 — runs.using: node24
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust
        # dtolnay/rust-toolchain@master (2026-08-05); toolchain remains stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Set up Python
        # actions/setup-python@v7.0.0 — runs.using: node24
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Build pheromoned (release)
        run: cargo build --release -p hiveclaw-daemon

      - name: Stage bundled pheromoned for wheel
        run: |
          mkdir -p crates/hiveclaw-python/python/hiveclaw_python/native/macos_arm64
          cp target/release/pheromoned crates/hiveclaw-python/python/hiveclaw_python/native/macos_arm64/
          chmod +x crates/hiveclaw-python/python/hiveclaw_python/native/macos_arm64/pheromoned

      - name: Build wheel (cibuildwheel + maturin)
        # pypa/cibuildwheel@v2.22.0 — version kept; tag pinned to commit SHA
        uses: pypa/cibuildwheel@ee63bf16da6cddfb925f542f2c7b59ad50e93969
        with:
          package-dir: crates/hiveclaw-python
        env:
          CIBW_BUILD: cp311-*
          CIBW_ARCHS_MACOS: arm64

      - name: Upload wheel
        # actions/upload-artifact@v7.0.1 — runs.using: node24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hiveclaw-python-wheel-macos-arm64
          path: crates/hiveclaw-python/wheelhouse/*.whl
