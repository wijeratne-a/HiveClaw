# CPU-only causal runtime. No GPU, daemon, Metal, or mlx.
# Catches hiveclaw_causal regressions on every push without macOS runners.
name: Causal runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 — runs.using: node24
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        # actions/setup-python@v7.0.0 — runs.using: node24
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Show toolchain versions
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install mypy
        run: python3 -m pip install --upgrade pip mypy

      - name: Show mypy version
        run: python3 -m mypy --version

      - name: make test-causal
        run: make test-causal PYTHON=python3
