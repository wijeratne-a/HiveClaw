[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "hiveclaw_python"
requires-python = ">=3.11"
dynamic = ["version"]
license = { file = "LICENSE" }
description = "HiveClaw Python bindings and helpers (AGPL-3.0)"
readme = "README-PYTHON.md"

[project.scripts]
hiveclaw-server = "hiveclaw_python.server_main:main"
hiveclaw-dashboard = "hiveclaw_python.cli.dashboard:main"
hiveclaw-overseer = "hiveclaw_python.cli.overseer:main"

[tool.maturin]
module-name = "hiveclaw_python._core"
python-source = "python"
manifest-path = "Cargo.toml"
# CI stages this path before build; force wheel inclusion even if gitignored locally.
include = [
    { path = "python/hiveclaw_python/native/macos_arm64/pheromoned", format = "wheel" },
]

[tool.cibuildwheel]
# Single wheel tag; runner must be macOS arm64 (GitHub macos-14).
build = "cp311-*"

[tool.cibuildwheel.macos]
archs = ["arm64"]
