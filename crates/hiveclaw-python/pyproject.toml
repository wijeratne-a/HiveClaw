[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "hiveclaw_python"
requires-python = ">=3.11"
dynamic = ["version"]
license = { file = "LICENSE" }
description = "HiveClaw Python bindings and helpers (AGPL-3.0)"
readme = "README-PYTHON.md"

[project.scripts]
hiveclaw-server = "hiveclaw_python.server_main:main"

[tool.maturin]
module-name = "hiveclaw_python._core"
python-source = "python"
manifest-path = "Cargo.toml"
